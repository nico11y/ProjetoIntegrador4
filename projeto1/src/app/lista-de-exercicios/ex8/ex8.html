<h1>Exercício 8: Cadastro de Produto</h1>
<label>Produto:</label><br>
<input type="text" [(ngModel)]="nome"><br>
<label>Valor:</label><br>
<input type="number" step="0.01" [(ngModel)]="valor"><br>
<label>Quantidade:</label><br>
<input type="number" [(ngModel)]="quantidade">

<h3>Produto:{{nome}}</h3>
<h3>Valor: {{valor}}</h3>
<h3>Quantidade: {{quantidade}}</h3>
<h3>Total: {{valor * quantidade}}</h3>
